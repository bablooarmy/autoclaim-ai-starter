[project]
name = "autoclaim-ai-backend"
version = "0.1.0"
description = "100% Local Open-Source Multi-Agent Car Damage Severity & Insurance RAG Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "langchain-ollama>=0.2.0",
    "qdrant-client>=1.12.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.2",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
