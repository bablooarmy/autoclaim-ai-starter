services:
  ollama:
    image: ollama/ollama:latest
    container_name: autoclaim-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: autoclaim-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: autoclaim-postgres
    environment:
      POSTGRES_USER: autoclaim
      POSTGRES_PASSWORD: autoclaim_local_dev
      POSTGRES_DB: autoclaim
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: autoclaim-backend
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen2.5vl:7b}
      OLLAMA_TEXT_MODEL: ${OLLAMA_TEXT_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://autoclaim:autoclaim_local_dev@postgres:5432/autoclaim
    ports:
      - "8000:8000"
    depends_on:
      - ollama
      - qdrant
      - postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: autoclaim-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
  pg_data:
